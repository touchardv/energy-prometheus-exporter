apiVersion: v1
kind: Service
metadata:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "{{ .Values.exporter.port }}"
    prometheus.io/scheme: http
    prometheus.io/scrape: "true"
  name: energy-prometheus-exporter
spec:
  ports:
    - name: web
      port: {{ .Values.exporter.port }}
      protocol: TCP
  selector:
    app: energy-prometheus-exporter
